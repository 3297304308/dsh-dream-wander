name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check index.js
          node --check lib/client.js
      - name: Unit tests
        run: node tests/index.mjs
      - name: Manifest self-check
        run: node tests/preflight-bundles.mjs
      - name: Pack manifest
        run: npm pack --dry-run
